plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.faceswap'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.faceswap"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = "11" }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.4'
    }
    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation "androidx.activity:activity-compose:1.7.2"

    // Material Components (needed by Theme.MaterialComponents in themes.xml)
    implementation 'com.google.android.material:material:1.9.0'

    // Jetpack Compose
    implementation "androidx.compose.ui:ui:1.4.3"
    implementation "androidx.compose.material:material:1.4.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"

    // ML Kit Face Detection (on-device)
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // Coroutines (play-services provides Task.await())
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.1'

    // OpenCV from Maven Central (includes Java API + native libs)
    implementation 'org.opencv:opencv:4.9.0'

    // On-device FFmpeg for video extraction/reassembly (community-maintained FFmpegKit build)
    implementation 'com.mrljdx:ffmpeg-kit-full:6.1.1'
}
